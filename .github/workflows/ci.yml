name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -B -m unittest discover tests -v

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "26.1",   fabric_api: "0.145.1+26.1" }
          - { mc: "26.1.2", fabric_api: "0.155.3+26.1.2" }
          - { mc: "26.2",   fabric_api: "0.161.0+26.2" }
          - { mc: "26.3",   fabric_api: "0.165.2+26.3" }
    name: build (${{ matrix.mc }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain -Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version=${{ matrix.fabric_api }}
