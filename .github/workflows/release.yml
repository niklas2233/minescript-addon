name: Release

# Push a tag like v1.0.1 to build and publish a GitHub release and a Modrinth version. The tag sets the mod version.
# Needs the repo secret MODRINTH_TOKEN (a Modrinth personal access token with the "Create versions" scope).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -B -m unittest discover tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain -Pmod_version=${GITHUB_REF_NAME#v}
      - uses: softprops/action-gh-release@v2
        with:
          files: build/libs/minescriptaddon-*.jar
          generate_release_notes: true
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: minescript-addon
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/minescriptaddon-*.jar
          name: Minescript Addon ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          loaders: fabric
          game-versions: |
            26.1
            26.1.1
            26.1.2
            26.2
            26.3
          java: 25
          dependencies: |
            fabric-api(required)
            minescript(recommended)
